# Codecov configuration (ADR-023). Informational only: coverage never blocks a
# PR — the number is a signal for reviewers, not a gate.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  behavior: default
  require_changes: true

flags:
  backend:
    paths: [backend/]
  agent:
    paths: [agent/]
# web/ uploads no coverage: what it is worth testing there is the wire contract
# (ADR-049) and the browser journey (ADR-028), and neither is a line-coverage
# number. See ADR-061.

# Thin wiring shells: their logic lives in tested library modules
# (backend::config, backend::healthcheck) — ADR-023.
ignore:
  - backend/src/main.rs
  - "backend/src/bin/**"
